services:
  prototype:
    image: nginx:1.27-alpine
    container_name: campusequip-frontend-prototype
    ports:
      - "127.0.0.1:${APP_PROTOTYPE_PORT:-5173}:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - campusequip
    restart: unless-stopped

networks:
  campusequip:
    external: true
    name: campusequip_default
